[project]
name = "gridwise-ai"
version = "0.1.0"
description = "Leakage-aware energy forecasting and constrained operational decision support"
requires-python = ">=3.11,<3.13"

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["data", "artifacts", ".venv", ".git"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src", "api.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
