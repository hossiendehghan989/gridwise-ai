name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: python -m pytest --cov=src --cov=api --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridwise-coverage
          path: coverage.xml
          if-no-files-found: ignore
